<title>NYX — From prompt to campaign in 60 seconds</title>
<style>/* ──────────────────────────────────────────────────────────────────
   NYX Design System — Colors + Typography
   Source of truth: Figma "NYX Devs Hands-Off" file, extracted from the
   Campulse Dashboard color-system frame and cross-referenced against
   Home, ImageCraft, VideoVista and the Assets page.

   NYX is a dark-first, deep-purple product suite. Surfaces are near-black
   neutrals stacked in elevation (BG → Layer1 → Layer2 → Layer3).
   Primary action color is a vivid violet (#7648EF) with a lighter
   "hover highlight" tint (#B39DFF) used for active states, outlined
   buttons, tabs and section eyebrows.
   ──────────────────────────────────────────────────────────────────── */

:root {
  /* ── Brand / Primary ─────────────────────────────────────────────── */
  --nyx-primary:        #7648EF;   /* vivid violet — CTAs, selected states */
  --nyx-primary-hover:  #5E35B1;   /* deeper violet — shadow tint */
  --nyx-primary-soft:   #B39DFF;   /* lavender — outlined btn borders, tab underline, eyebrows */
  --nyx-primary-bg:     rgba(118, 72, 239, 0.08);
  --nyx-primary-glow:   rgba(94, 53, 177, 0.25);

  /* ── Surfaces (dark) ─────────────────────────────────────────────── */
  --nyx-bg:             #18181A;   /* app background */
  --nyx-nav:            #232227;   /* left nav */
  --nyx-layer-1:        #1E1E20;   /* cards, panels */
  --nyx-layer-2:        #2C2C30;   /* inputs, tags, subtle containers */
  --nyx-layer-3:        #161618;   /* nested / lower */
  --nyx-layer-5:        #1A1A1D;   /* special overlays */

  /* ── Borders ─────────────────────────────────────────────────────── */
  --nyx-border:         #323236;   /* default 1px border */
  --nyx-border-strong:  #3F3F42;   /* emphasized border */
  --nyx-border-muted:   #2C2C30;   /* hairline on layer-1 */
  --nyx-divider:        rgba(255, 255, 255, 0.06);

  /* ── Text ────────────────────────────────────────────────────────── */
  --nyx-fg:             #FFFFFF;   /* titles, primary text */
  --nyx-fg-muted:       #C5C5C5;   /* body secondary */
  --nyx-fg-dim:         #B0B0B0;   /* labels, disabled */
  --nyx-fg-soft:        #777777;   /* placeholder, timestamps */
  --nyx-fg-inverse:     #0B1215;   /* text on white */

  /* ── Semantic ────────────────────────────────────────────────────── */
  --nyx-success:        #4ADE80;   /* +delta pills, success */
  --nyx-success-strong: #1C994A;
  --nyx-success-bg:     rgba(74, 222, 128, 0.12);
  --nyx-danger:         #F87171;   /* -delta, alerts */
  --nyx-danger-bg:      rgba(248, 113, 113, 0.12);
  --nyx-warning:        #EB75B2;   /* pink accent — Campulse alerts */
  --nyx-info:           #B39DFF;

  /* ── Chart palette (violet-forward, extends into pink + green) ──── */
  --nyx-chart-1:        #7648EF;
  --nyx-chart-2:        #B39DFF;
  --nyx-chart-3:        #5E35B1;
  --nyx-chart-4:        #EB75B2;
  --nyx-chart-5:        #4ADE80;
  --nyx-chart-6:        #DBC3EB;

  /* ── Shadows + elevation ────────────────────────────────────────── */
  --nyx-shadow-sm:      0 1px 2px rgba(0, 0, 0, 0.3);
  --nyx-shadow-md:      0 4px 6px -4px rgba(0, 0, 0, 0.3), 0 10px 15px -3px rgba(0, 0, 0, 0.3);
  --nyx-shadow-lg:      0 0 15px rgba(94, 53, 177, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.1);
  --nyx-shadow-glow:    0 0 15px rgba(94, 53, 177, 0.25);
  --nyx-shadow-card:    0 4px 6px -4px rgba(94, 53, 177, 0.05), 0 10px 15px -3px rgba(94, 53, 177, 0.05);

  /* ── Radii ───────────────────────────────────────────────────────── */
  --nyx-radius-xs:       4px;
  --nyx-radius-sm:       8px;
  --nyx-radius-md:      10px;   /* nav tiles */
  --nyx-radius-lg:      12px;   /* cards */
  --nyx-radius-xl:      16px;   /* large cards / tables */
  --nyx-radius-pill:    40px;   /* tags */
  --nyx-radius-full:  9999px;   /* buttons, avatars */

  /* ── Spacing (4px base) ──────────────────────────────────────────── */
  --nyx-space-1:         4px;
  --nyx-space-2:         8px;
  --nyx-space-3:        12px;
  --nyx-space-4:        16px;
  --nyx-space-5:        20px;
  --nyx-space-6:        24px;
  --nyx-space-8:        32px;
  --nyx-space-10:       40px;
  --nyx-space-12:       48px;
  --nyx-space-16:       64px;

  /* ── Type families ───────────────────────────────────────────────── */
  --nyx-font-display:   "Montserrat", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --nyx-font-body:      "Montserrat", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --nyx-font-ui:        "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif; /* dashboards + data tables */
  --nyx-font-mono:      "JetBrains Mono", ui-monospace, Consolas, "Liberation Mono", monospace;

  /* ── Type scale (matches Figma: 10 / 12 / 13 / 14 / 15 / 16 / 18 / 20 / 23 / 25 / 32) */
  --nyx-text-xs:        10px;   /* tag labels, letter-spaced */
  --nyx-text-sm:        12px;   /* nav labels, captions */
  --nyx-text-ui:        13px;   /* dense UI rows */
  --nyx-text-base:      14px;   /* body default */
  --nyx-text-md:        15px;   /* body comfortable */
  --nyx-text-lg:        16px;   /* body large / section lead */
  --nyx-text-xl:        18px;   /* card titles */
  --nyx-text-2xl:       20px;
  --nyx-text-3xl:       23px;   /* section headings */
  --nyx-text-4xl:       25px;   /* page headings */
  --nyx-text-5xl:       32px;   /* display (docs + color-system) */

  /* Weights */
  --nyx-fw-regular:     400;
  --nyx-fw-medium:      500;
  --nyx-fw-semibold:    600;
  --nyx-fw-bold:        700;
}

/* ── Light mode ──────────────────────────────────────────────────────
   NYX has two shipping modes: Dark (default, above) and Light.
   In Light the sidebar stays near-black (brand anchor), but the main
   canvas turns pale lavender `#E8E7EE`, cards go white `#FFFFFF`,
   text flips to black, and borders use a light violet-neutral.
   Outlined buttons keep their 2px `#7648EF` border (not lavender) —
   on white the vivid violet reads as the outlined motif.
   Sidebar-scoped colors (AppShell) stay dark in both modes so the
   brand plate + violet glow are preserved as the vertical brand bar. */
:root[data-theme="light"],
.nyx-light {
  --nyx-bg:             #E8E7EE;
  --nyx-nav:            #232227;       /* dark nav in both modes */
  --nyx-layer-1:        #FFFFFF;       /* card surface */
  --nyx-layer-2:        #F2F1F7;       /* inputs, tags */
  --nyx-layer-3:        #ECEBF2;       /* nested / lower */
  --nyx-layer-5:        #F7F6FB;

  --nyx-border:         #D8D6E2;
  --nyx-border-strong:  #BFBCCF;
  --nyx-border-muted:   #E5E3EC;
  --nyx-divider:        rgba(0, 0, 0, 0.06);

  --nyx-fg:             #0B0B0F;
  --nyx-fg-muted:       #3B3B42;
  --nyx-fg-dim:         #6B6B74;
  --nyx-fg-soft:        #8E8E97;
  --nyx-fg-inverse:     #FFFFFF;

  /* brand stays — violet reads well on white */
  --nyx-primary-bg:     rgba(118, 72, 239, 0.08);
  --nyx-shadow-card:    0 4px 6px -4px rgba(94, 53, 177, 0.08), 0 10px 15px -3px rgba(94, 53, 177, 0.06);
  --nyx-shadow-sm:      0 1px 2px rgba(0, 0, 0, 0.06);
  --nyx-shadow-md:      0 4px 6px -4px rgba(0, 0, 0, 0.08), 0 10px 15px -3px rgba(0, 0, 0, 0.06);

<style>/* ───────────────────────────────────────────────────────────────────
   Shared section styles for the "From prompt to campaign" hero
   Built on NYX tokens — see nyx-tokens.css
   ─────────────────────────────────────────────────────────────────── */

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--nyx-bg);
  color: var(--nyx-fg);
  font-family: var(--nyx-font-display);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  scroll-behavior: smooth;
}

body {
  overflow-x: hidden;
}

/* ── Atmospheric backdrop (very subtle, drifts under everything) ── */
.bg-fx {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
.bg-fx::before,
.bg-fx::after {
  content: "";
  position: absolute;
  width: 60vmax;
  height: 60vmax;
  border-radius: 50%;
  filter: blur(120px);
  opacity: 0.35;
}
.bg-fx::before {
  top: -20vmax;
  left: -10vmax;
  background: radial-gradient(circle, var(--accent, #7648EF) 0%, transparent 60%);
  opacity: 0.18;
}
.bg-fx::after {
  bottom: -25vmax;
  right: -15vmax;
  background: radial-gradient(circle, var(--accent, #7648EF) 0%, transparent 60%);
  opacity: 0.12;
}

/* Subtle grain over backdrop */
.bg-fx .grain {
  position: absolute;
  inset: 0;
  background-image: radial-gradient(rgba(255,255,255,0.025) 1px, transparent 1px);
  background-size: 3px 3px;
  mix-blend-mode: overlay;
}

/* ── Top nav ── */
.site-nav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 40px;
  background: rgba(24, 24, 26, 0.65);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--nyx-divider);
}
.site-nav .brand {
  display: flex;
  align-items: center;
  gap: 12px;
}
.site-nav .brand img {
  width: 32px;
  height: 32px;
  border-radius: 8px;
}
.site-nav .brand .wordmark {
  font-family: var(--nyx-font-display);
  font-weight: 700;
  font-size: 18px;
  letter-spacing: 0.08em;
}
.site-nav .nav-links {
  display: flex;
  gap: 28px;
  font-size: 14px;
  color: var(--nyx-fg-muted);
}
.site-nav .nav-links a {
  color: inherit;
  text-decoration: none;
  transition: color 160ms ease;
}
.site-nav .nav-links a:hover { color: var(--nyx-fg); }

.cta-btn {
  background: var(--nyx-layer-2);
  border: 2px solid var(--nyx-primary-soft);
  color: var(--nyx-fg);
  font-family: var(--nyx-font-display);
  font-weight: 600;
  font-size: 14px;
  padding: 10px 18px;
  border-radius: 9999px;
  cursor: pointer;
  box-shadow: var(--nyx-shadow-card);
  transition: transform 160ms ease, box-shadow 160ms ease;
}
.cta-btn:hover {
  transform: translateY(-1px);
  box-shadow: var(--nyx-shadow-lg);
}
.cta-btn.solid {
  background: var(--accent, var(--nyx-primary));
  border-color: transparent;
}

/* ── Hero intro (above the pinned section) ── */
.intro-band {
  position: relative;
  z-index: 1;
  min-height: 78vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 140px 24px 80px;
}
.intro-band .eyebrow {
  font-family: var(--nyx-font-ui);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--nyx-primary-soft);
  margin-bottom: 22px;
  display: inline-flex;
  align-items: center;
  gap: 10px;
}
.intro-band .eyebrow::before,
.intro-band .eyebrow::after {
  content: "";
  width: 24px;
  height: 1px;
  background: var(--nyx-primary-soft);
  opacity: 0.4;
}
.intro-band h1 {
  font-family: var(--nyx-font-display);
  font-weight: 700;
  font-size: clamp(38px, 6.5vw, 86px);
  line-height: 1.04;
  letter-spacing: -0.025em;
  margin: 0 0 22px;
  max-width: 16ch;
  text-wrap: balance;
}
.intro-band h1 .accent {
  background: linear-gradient(180deg, var(--accent, #B39DFF) 0%, var(--nyx-primary) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.intro-band p {
  font-size: 18px;
  color: var(--nyx-fg-muted);
  max-width: 56ch;
  line-height: 1.55;
  margin: 0 0 36px;
}
.intro-band .scroll-cue {
  margin-top: 18px;
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  color: var(--nyx-fg-soft);
  font-size: 11px;
  letter-spacing: 0.24em;
  text-transform: uppercase;
}
.intro-band .scroll-cue .dot {
  width: 4px; height: 4px; border-radius: 50%;
  background: var(--accent, var(--nyx-primary));
  box-shadow: 0 0 12px var(--accent, var(--nyx-primary));
  animation: pulseDown 2.2s ease-in-out infinite;
}
@keyframes pulseDown {
  0%, 100% { transform: translateY(0); opacity: 0.6; }
  50%      { transform: translateY(10px); opacity: 1; }
}

/* ── Variation switcher (sticky pill near top, above pinned section) ── */
.variation-switcher {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 40;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 6px;
  background: rgba(28, 28, 32, 0.78);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--nyx-border);
  border-radius: 9999px;
  box-shadow: var(--nyx-shadow-card);
}
.variation-switcher button {
  background: transparent;
  border: none;
  color: var(--nyx-fg-muted);
  font-family: var(--nyx-font-ui);
  font-weight: 600;
  font-size: 12px;
  letter-spacing: 0.04em;
  padding: 8px 16px;
  border-radius: 9999px;
  cursor: pointer;
  transition: color 160ms ease, background 160ms ease;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.variation-switcher button:hover { color: var(--nyx-fg); }
.variation-switcher button.active {
  background: var(--accent, var(--nyx-primary));
  color: white;
  box-shadow: 0 0 12px var(--nyx-primary-glow);
}
.variation-switcher .dot {
  width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.7;
}

/* ── Pinned hero shell — every variation lives in here ── */
.pinned-section {
  position: relative;
  z-index: 1;
  /* The total scroll height controls the number of "beats" the user
     can scrub through. ~3.5 viewports = pleasant medium length. */
  height: 480vh;
}
.pinned-stage {
  position: sticky;
  top: 0;
  height: 100vh;
  width: 100%;
  overflow: hidden;
}

/* Headline that sits at the top of the pinned stage */
.stage-headline {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  z-index: 5;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 64px 24px 0;
  text-align: center;
  pointer-events: none;
}
.stage-headline .crumb {
  font-family: var(--nyx-font-ui);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--nyx-primary-soft);
  margin-bottom: 14px;
  opacity: 0.9;
}
.stage-headline h2 {
  font-family: var(--nyx-font-display);
  font-weight: 700;
  font-size: clamp(28px, 3.4vw, 44px);
  letter-spacing: -0.02em;
  margin: 0;
  color: var(--nyx-fg);
  line-height: 1.1;
  max-width: 22ch;
  text-wrap: balance;
}
.stage-headline .sub {
  margin-top: 14px;
  font-size: 15px;
  color: var(--nyx-fg-muted);
  max-width: 54ch;
  line-height: 1.55;
}

/* Bottom rail — scene index + progress bar */
.scene-rail {
  position: absolute;
  left: 0; right: 0; bottom: 28px;
  z-index: 5;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  pointer-events: none;
}
.scene-rail .ticks {
  display: flex;
  gap: 6px;
  align-items: center;
}
.scene-rail .tick {
  width: 28px; height: 2px;
  background: rgba(255,255,255,0.12);
  border-radius: 9999px;
  transition: background 240ms ease, width 240ms ease;
}
.scene-rail .tick.passed { background: var(--accent, var(--nyx-primary)); }
.scene-rail .tick.current {
  background: var(--accent, var(--nyx-primary));
  width: 48px;
  box-shadow: 0 0 12px var(--nyx-primary-glow);
}
.scene-rail .scene-label {
  font-family: var(--nyx-font-ui);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--nyx-fg-dim);
}
.scene-rail .scene-label .num {
  color: var(--accent, var(--nyx-primary-soft));
  margin-right: 8px;
}

/* ── Below-the-fold band ── */
.outro-band {
  position: relative;
  z-index: 1;
  padding: 120px 24px 160px;
  text-align: center;
  border-top: 1px solid var(--nyx-divider);
  background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.4) 100%);
}
.outro-band h3 {
  font-family: var(--nyx-font-display);
  font-weight: 700;
  font-size: clamp(28px, 4vw, 48px);
  letter-spacing: -0.02em;
  margin: 0 0 18px;
  max-width: 20ch;
  margin-inline: auto;
  text-wrap: balance;
}
.outro-band p {
  font-size: 16px;
  color: var(--nyx-fg-muted);
  max-width: 52ch;
  margin: 0 auto 32px;
  line-height: 1.6;
}
.outro-band .stat-row {
  display: flex;
  justify-content: center;
  gap: 64px;
  margin-top: 64px;
  flex-wrap: wrap;
}
.outro-band .stat .num {
  font-family: var(--nyx-font-display);
  font-weight: 700;
  font-size: 38px;
  letter-spacing: -0.02em;
  background: linear-gradient(180deg, #fff, var(--nyx-primary-soft));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.outro-band .stat .label {
  margin-top: 6px;
  font-family: var(--nyx-font-ui);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--nyx-fg-dim);
}

/* ── Card chrome shared by every scene ── */
.scene-card {
  background: linear-gradient(180deg, #1F1F22 0%, #18181A 100%);
  border: 1px solid var(--nyx-border);
  border-radius: 18px;
  box-shadow: var(--nyx-shadow-card), 0 30px 80px -30px rgba(0,0,0,0.6);
}
.scene-card-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--nyx-border-muted);
}
.scene-card-header .traffic { display: flex; gap: 6px; }
.scene-card-header .traffic span {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--nyx-layer-2);
}
.scene-card-header .title {
  font-family: var(--nyx-font-ui);
  font-size: 12px;
  font-weight: 500;
  color: var(--nyx-fg-dim);
  margin-left: 8px;
  letter-spacing: 0.04em;
}
.scene-card-header .tag {
  margin-left: auto;
  font-family: var(--nyx-font-ui);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--accent, var(--nyx-primary-soft));
  padding: 4px 10px;
  border: 1px solid currentColor;
  border-radius: 9999px;
  opacity: 0.9;
}

/* Caret blink for typing input */
.caret {
  display: inline-block;
  width: 2px;
  height: 1em;
  vertical-align: -0.15em;
  background: var(--accent, var(--nyx-primary));
  margin-left: 2px;
  animation: blink 1s steps(1, end) infinite;
}
@keyframes blink {
  50% { opacity: 0; }
}

/* Ambient drift utility */
@keyframes drift {
  0%, 100% { transform: translate3d(0,0,0); }
  50%      { transform: translate3d(0,-6px,0); }
}

/* Shimmer (used for "thinking") */
.thinking-shimmer {
  position: relative;
  overflow: hidden;
  background: var(--nyx-layer-2);
  border-radius: 6px;
}
.thinking-shimmer::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.06) 50%, transparent 100%);
  animation: shimmer 1.6s linear infinite;
}
@keyframes shimmer {
  0%   { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}

/* Platform pill styles */
.platform-pill {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  background: var(--nyx-layer-2);
  border: 1px solid var(--nyx-border);
  border-radius: 9999px;
  font-family: var(--nyx-font-ui);
  font-size: 13px;
  font-weight: 600;
  color: var(--nyx-fg);
}
.platform-pill .swatch {
  width: 22px; height: 22px;
  border-radius: 50%;
  display: grid; place-items: center;
  color: white;
  flex-shrink: 0;
}

/* Hide scrollbars on stages */
.pinned-stage::-webkit-scrollbar { display: none; }
